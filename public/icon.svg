<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with Safe Margin (Maskable friendly) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Camera Body Silhouette -->
  <rect x="76" y="130" width="360" height="270" rx="36" fill="#1e293b" stroke="#334155" stroke-width="6"/>
  <!-- Top Viewfinder / Flash bump -->
  <path d="M196 130 L220 95 L292 95 L316 130 Z" fill="#334155"/>
  <!-- Shutter Button -->
  <rect x="110" y="105" width="48" height="15" rx="6" fill="#ef4444"/>
  <!-- Flash LED -->
  <circle cx="370" cy="180" r="14" fill="#fbbf24" opacity="0.9"/>

  <!-- Lens Outer Ring -->
  <circle cx="256" cy="265" r="95" fill="#0f172a" stroke="url(#lensGrad)" stroke-width="8"/>
  <circle cx="256" cy="265" r="75" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <circle cx="256" cy="265" r="55" fill="#090d16"/>
  <circle cx="256" cy="265" r="28" fill="url(#accentGrad)" opacity="0.85" filter="url(#glow)"/>

  <!-- GPS Pin & Crosshair Overlaid in Center -->
  <path d="M256 220 C244 220 234 230 234 242 C234 258 256 278 256 278 C256 278 278 258 278 242 C278 230 268 220 256 220 Z" fill="#ffffff"/>
  <circle cx="256" cy="238" r="5" fill="#0ea5e9"/>

  <!-- Reticle Crosshairs -->
  <line x1="256" y1="145" x2="256" y2="165" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="365" x2="256" y2="385" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="136" y1="265" x2="156" y2="265" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="356" y1="265" x2="376" y2="265" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Corner Brackets -->
  <path d="M110 180 L110 160 L130 160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M402 180 L402 160 L382 160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 350 L110 370 L130 370" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M402 350 L402 370 L382 370" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
